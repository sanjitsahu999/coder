<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
</head>

<body>

<center>

<h1>Student Form</h1>

<form>

<table border="1" cellpadding="10">

    <tr>
        <td>Name</td>
        <td>
            <input type="text" name="name" placeholder="Enter your name">
        </td>
    </tr>

    <tr>
        <td>Password</td>
        <td>
            <input type="password" name="password" placeholder="Enter password">
        </td>
    </tr>

    <tr>
        <td>Course</td>
        <td>
            <input type="text" name="course" placeholder="Enter your course">
        </td>
    </tr>

    <tr>
        <td>Father Name</td>
        <td>
            <input type="text" name="father_name" placeholder="Enter father name">
        </td>
    </tr>

    <tr>
        <td>Mother Name</td>
        <td>
            <input type="text" name="mother_name" placeholder="Enter mother name">
        </td>
    </tr>

    <tr>
        <td>Phone Number</td>
        <td>
            <input type="number" name="phone" placeholder="Enter phone number">
        </td>
    </tr>

    <tr>
        <td>Email ID</td>
        <td>
            <input type="email" name="email" placeholder="Enter email id">
        </td>
    </tr>

    <tr>
        <td>Date of Birth</td>
        <td>
            <input type="date" name="dob">
        </td>
    </tr>

    <tr>
        <td>Choose File</td>
        <td>
            <input type="file" name="file">
        </td>
    </tr>

    <tr>
        <td>Select Course</td>
        <td>
            <select name="course_select">
                <option>BCA</option>
                <option>BBA</option>
                <option>MCA</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>Gender</td>
        <td>
            <select name="gender">
                <option>Male</option>
                <option>Female</option>
            </select>
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </td>
    </tr>

</table>

</form>

</center>

</body>
</html>
