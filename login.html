<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Login Page</title>
</head>

<body>

    <center>

        <h1>Professional Login Page</h1>

        <form>

            <table cellpadding="10">

                <tr>
                    <td>
                        <label><b>Full Name</b></label><br>
                        <input type="text" placeholder="Enter Full Name" size="40">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label><b>Email Address</b></label><br>
                        <input type="email" placeholder="Enter Email" size="40">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label><b>Password</b></label><br>
                        <input type="password" placeholder="Enter Password" size="40">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="checkbox"> Remember Me
                    </td>
                </tr>

                <tr>
                    <td>
                        <button type="submit">Login</button>

                        <button type="reset">Reset</button>
                    </td>
                </tr>

                <tr>
                    <td>
                        <a href="#">Forgot Password?</a>
                    </td>
                </tr>

                <tr>
                    <td>
                        Don't have an account?
                        <a href="#">Register</a>
                    </td>
                </tr>

            </table>

        </form>

    </center>

</body>
</html>
